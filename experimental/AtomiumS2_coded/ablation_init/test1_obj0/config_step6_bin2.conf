# ========================================================================
# TEST 1 -- object starts from ZERO, aperture from step0 as usual.
#
# INITIALISATION ABLATION, bin 2 only -- no ladder, no step 7, no seed rebuild.
# Generated from ../../config_step6_bin2_pass1.conf; every key below is that
# file verbatim except path_out, obj_init_file and code_file.
#
# obj_init_file is OMITTED, not pointed at a missing file: CodedReader.read_obj
# zeroes the object and logs "no initial object; starting from zero", and
# preflight.py treats an absent key as a WARNING but a set-but-missing path as
# a hard ERROR.
# ========================================================================

# AtomiumS2, coded aperture -- single-distance HT through a gold mask,
# ESRF ID16A, 33.35 keV.  BH reconstruction (step 6), hierarchical level
# bin=2 (4x4 binning).
#
# PASS 1 of 2 -- POSITIONS FROZEN (REVERTED 2026-11-10).
#
# History, so this does not get "fixed" back and forth again: this file
# briefly unfroze pos (rho[pos] 0 -> 0.01), reasoning that a coded aperture
# lets `code`/`pos_code` absorb drift that frozen positions can't, biasing a
# frozen pass 1. That reasoning was not wrong in the abstract, but the actual
# result was worse: the unfrozen pass-1 object looked worse than this frozen
# baseline on inspection. Reverted. A frozen pass 1 is also what step 7's
# whole measurement assumes (the drift stays in `pos`'s absence rather than
# being partly refined away before it can be measured), same as the
# multi-distance pipeline this was copied from.
#
# The ladder runs twice.  Pass 1 (this file, then config_step6_bin1_pass1.conf)
# holds pos at step 3's shifts_cor: rho[pos]=0 makes the position gradient
# identically zero in RecCoded, so nothing moves.  step7.py then reads the
# pass-1 bin-1 checkpoint, fits the per-angle drift, and writes
# correct_correct3D_extra.txt NEXT TO THE CONFIGS, where the pass-2 configs
# (config_step6_bin{2,1,0}.conf) pick it up via correct3d_extra_file.
#
# Separate path_out (rec/pass1) so pass 2 cannot overwrite the volume step 7
# was derived from; both iteration ladders start at 0 and would otherwise
# collide in checkpoints/.
#
# Both levels SHARE path_out and hand off through start_iter: bin 2 starts
# fresh, bin 1 resumes from the checkpoint the level above wrote and
# CodedReader upsamples it (x2). Comment out the rungs you do not want in
# polaris_run.sh rather than editing this.

# ---------------------------------------------------------------------------
# WHERE THIS RUNS.  Pre-processing (step0 + the notebooks) happens on tomo5;
# step 6 (and step 7, in between the two passes) is what goes to Polaris.  Uncomment the trio for the machine
# you are on -- nothing auto-detects it. (path, code_file and path_out all
# three move together -- code.npy is transferred alongside codedHT.h5, it
# does not stay on tomo5.)
#
#   tomo5    path=/data3/cekmekci/AtomiumS2_coded/ht
#            code_file=/data3/cekmekci/AtomiumS2_coded/nfp/code.npy
#            path_out=/data3/cekmekci/AtomiumS2_coded/rec/pass1
#   Polaris  path=/eagle/APS_IRI/cekmekci/AtomiumS2_coded/ht
#            code_file=/eagle/APS_IRI/cekmekci/AtomiumS2_coded/nfp/code.npy
#            path_out=/eagle/APS_IRI/cekmekci/AtomiumS2_coded/rec/pass1
#
# Transfer before the first Polaris run (Globus): codedHT.h5 (170 GB),
# code.npy (513 MB), obj_init.npy (134 GB at nobj=2560).  data_nfp.h5 and prb.npy stay on
# tomo5 -- step 6 does not read them.  And stripe path_out BEFORE the first
# run, eagle defaults to one OST:   lfs setstripe -c 8 -S 16M <path_out>
# ---------------------------------------------------------------------------
# tomo5:
# path=/data3/cekmekci/AtomiumS2_coded/ht
# code_file=/data3/cekmekci/AtomiumS2_coded/nfp/code.npy
# path_out=/data3/cekmekci/AtomiumS2_coded/rec/pass1
# Polaris (ACTIVE):
path=/eagle/APS_IRI/cekmekci/AtomiumS2_coded/ht
in_file=codedHT.h5    # /exchange/{pdata,prb,theta,shifts_cor,shifts_code,...}
code_file=/eagle/APS_IRI/cekmekci/AtomiumS2_coded/nfp/code.npy  # the real aperture from step0
# obj_init_file  DELIBERATELY UNSET -- the object starts from zero.
path_out=/eagle/APS_IRI/cekmekci/AtomiumS2_coded/rec/ablation_init/test1_obj0   # this test only

bin=2                 # binning level; every pixel count below is already divided by 2**bin
nchunk=16
ntheta=2400           # SUBSAMPLED count (ids = start_theta + stride*arange(ntheta));
                      # 2400 of the 7200 acquired angles, see the stride comment below
start_theta=0
stride=3              # subsampled 7200 -> 2400 angles for this cheap, single-rung
                      # ablation (no ladder/checkpoint handoff here, so unlike the real
                      # configs stride does NOT need to match anything else). 2400 is
                      # ~2.4x the (pi/2)*nobj=1005 Nyquist angular-sampling estimate at
                      # bin2 (nobj=640), well clear of angular-undersampling streaks --
                      # the thing we are trying to observe here is whether INITIALISATION
                      # produces streaks, and this is bought at ~2x the 1-node runtime of
                      # the stride=6 version (see polaris_run.sh's sizing note).

niter=512            # last iteration executed is 511
start_iter=0         # 0 = start fresh from the step-5 Paganin+FBP volume
checkpoint_step=32    # save checkpoint every N iters (-1 = disabled)
error_step=32         # print error every N iters
debug_step=-1

nz=512
n=512
nzobj=640
nobj=640              # object padded by n/4 so the sample's travel stays inside it
ncode=2048            # aperture plane, 8192 >> bin
mask=1.1              # circular mask radius as fraction of n (-1 = no mask)

# Source-to-code distance.  NEGATIVE: the aperture sits upstream of the focal
# spot, so the code -> sample Fresnel distance is negative too.  NOT the
# nominal value in data_nfp.h5 -- this is the distance that puts the mask in
# focus and is tuned by hand.
z1_code=-17.75e-3
code_pad_frac=0.125   # each projection transforms an [nz+2P, n+2P] window of the
                      # ncode^2 plane instead of the whole thing; accuracy ~1/sqrt(P)

# --- out-of-grid detector pixels ---
# Rotation-axis offset, (row, col) UNBINNED px, added to shifts_cor by
# CodedReader.read_pos.  MUST MATCH config_steps15.conf's rot_axis_offset:
# stage 5 folds the same value into the Paganin seed, and step 6 applies it
# again here independently (same as the multi-distance pipeline's
# center_src=config mode).  Not double counting -- step 3 writes shifts_cor
# without it.  Disagree with stage 5 and the seed and the forward model use
# different rotation axes, which shows up as two offset copies of the object.
rot_axis_offset=0.0,-24.0

mask_oob=1            # drop detector pixels whose footprint leaves the object grid
mask_oob_margin=2     # slack in detector px, covering pos drift during refinement

# --- misfit ---
model=intensity       # switched from amplitude 2026-11-10 -- see header
psf_sigma=0.0         # Gaussian sigma in BINNED detector px; halve per bin level

lam_laplacian=8e-5    # from holotomo-coded-atomiums2's bin2 value, 2026-11-10.
                      # rho[obj]=1 above satisfies RecCoded's constraint.
rho=1,0.03,0,0.03,0.01   # positions FROZEN again -- REVERTED 2026-11-10.
                      # Unfreezing them (0 -> 0.01) did not help: the resulting
                      # pass-1 object looked worse than this frozen baseline,
                      # and a frozen pass 1 is what step 7's measurement (and
                      # the whole two-pass design) actually assumes.
estimate_rho=False    # switched back to False 2026-11-11, user request
rho_estimate_niter=16

freeze_code=False     # True holds the aperture fixed (step0 already measured it)
freeze_pos_code=False

# PASS 1: no correct3d_extra_file key -- never apply step 7's file, even if
# one is left over from an earlier run. Pass 1 is the baseline step 7
# measures against; applying a stale file here would mean step 7 fits only
# the residual and pass 2 silently drops the correction already folded into
# it.  (pos refining is not the same thing: that is the solver finding its
# own per-angle correction from the data, which is what gives step 7 a
# volume worth measuring.)

fused_hessian=True    # beta and alpha from one Hessian sweep instead of three
check_fused_hessian=False

shift_type=fft        # object-plane shift; one distance means m=1 so fft is exact
log_level=INFO
