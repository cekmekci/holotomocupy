# AtomiumS2, coded aperture -- ESRF ID16A, 33.35 keV.
# STAGES 1-5: the HOLOTOMOGRAPHY scan.  Convert, flat-correct, find the
# per-angle shifts, build the Paganin reconstruction.
#
# Stages 1, 2, 3, 5 are both notebooks and one batch script, steps15.py; both
# read this file for their paths and for the few numbers that change per
# dataset.  Structural constants (dark/flat counts, GPU counts, chunk sizes)
# stay in the notebooks / steps15.py itself.

# --- raw input, read-only ---
raw_ht=/data3/vnikitin/ca/raw/AtomiumS2_codedht_random_007nm   # step1
pfile=AtomiumS2_codedht_random_007nm                           # scan prefix
correction_file=/data3/vnikitin/ca/raw/AtomiumS2_HT_007nm_/correct_correct3D.txt  # step3

# tomo5:
path=/data3/cekmekci/AtomiumS2_coded/ht
nfp_file=/data3/cekmekci/AtomiumS2_coded/nfp/data_nfp.h5
code_file=/data3/cekmekci/AtomiumS2_coded/nfp/code.npy
prb_file=/data3/cekmekci/AtomiumS2_coded/nfp/prb.npy
# Polaris (ACTIVE):
# path=/eagle/APS_IRI/cekmekci/AtomiumS2_coded/ht   # processed data for the HT scan,
in_file=codedHT.h5    # written by step1, appended to by step2 and step3

# --- stage 0's products, consumed by stages 3 and 5 ---
# ABSOLUTE paths: these live in config_step0.conf's `path` (the nfp/ folder),
# not this file's `path` (ht/) -- `_rel` only joins against `path` for a
# relative name, so an absolute path here is required, not just allowed.
# nfp_file=/eagle/APS_IRI/cekmekci/AtomiumS2_coded/nfp/data_nfp.h5  # stage 3 and 5 take the nominal z1_code from here
# code_file=/eagle/APS_IRI/cekmekci/AtomiumS2_coded/nfp/code.npy
# prb_file=/eagle/APS_IRI/cekmekci/AtomiumS2_coded/nfp/prb.npy

# --- stage 5's product, consumed by step 6 ---
obj_init_file=obj_init.npy

start_step=5          # stages 1-3 already ran and wrote shifts_cor/shifts_code/
                      # prb to codedHT.h5, untouched by stage 5's own code --
                      # set back to 1 (or comment out) only if the raw data or
                      # the shift-finding itself needs to be redone.

ntheta=7200           # frames in the raw scan, 0..179.975 deg in 0.025 steps
n=2048                # detector size (pixels), unbinned
nobj=2560             # object grid (pixels), unbinned -- stage 5 pads/tapers up
                      # to this before FBP instead of leaving it to step 6's
                      # CodedReader to zero-pad after the fact. MUST MATCH
                      # config_step6_bin0.conf's nobj.

# Source-to-code distance.  Set explicitly rather than left to the fallback,
# which reads /exchange/z1 out of data_nfp.h5 -- that scalar was wrong until
# 2026-11-14 (step0a subtracted the focus offset sx0 from z1c, but z1c is
# already measured from the focus) and the eagle copy of the file may still
# carry the old -19.036e-3.  -17.75e-3 is the nominal value, and the one all
# nine config_step6_*.conf already use.
z1_code=-17.75e-3

rot_axis_offset=0.0,-24.0   # added to shifts_cor in stage 5, (row, col) px

paganin=30.0                # delta/beta for the per-projection inversion.
                      # WAS DEAD CONFIG before 2026-11-11 (stage 5 hardcoded 20);
                      # 30.0 is where step5_paganin_ablation.ipynb settled.
paganin_alpha=1e-2          # Paganin regulariser (his 0.01)
fbp_filter=ramp             # his :1315. 'shepp' was ours (+ a pi/4 scale factor,
                      # now dropped to match him -- see steps15.py FBP_SCALE)
mask_r=0.9                  # circular FBP mask, his :1309 (ours was 0)
smooth_fwhm=17.0            # Gaussian FWHM in UNBINNED px on numerator AND
                      # denominator before the ratio, his :894-895. 0 disables.
edge_crop=36                # unbinned px stripped off every side of the division
                      # before padding (modelled flat field unreliable there)
bg_box=0.05,0.15,0.05,0.15  # row0,row1,col0,col1 as fractions of the DETECTOR; its
                      # mean on angle 0 is the level the pad ramps to
paganin_bg_box=0.15,0.25,0.15,0.25   # same, fractions of the PADDED frame; its mean on
                      # angle 0's Paganin phase is subtracted from every angle

log_level=INFO
