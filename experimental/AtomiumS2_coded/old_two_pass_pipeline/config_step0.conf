# AtomiumS2, coded aperture -- ESRF ID16A, 33.35 keV.
# STEP 0: near-field ptychography on the coded aperture alone, which is how the coded
# aperture and the probe are measured before the holotomography stage uses
# them. 
#
# step0a / step0b pre-processes the raw data. step0 is the reconstruction.

# --- raw NFP scan, read-only. Input to step0a only. ---
raw_nfp=/data3/vnikitin/ca/SiemensLH/code2um_nfp18x18_01    # h5 files for the NFP scan

# --- step0a and step0b writes here, step0.py reads it back ---
path=/data3/cekmekci/AtomiumS2_coded/nfp
in_file=data_nfp.h5   # processed nfp data, /exchange/{pdata,pref,shifts,energy,z1,...}

# --- step0.py's OUTPUT, written last, here last ---
# Defaults to the same folder as `path` if left unset -- there is nowhere
# else for step0's results to go on tomo5. Only step6 on Polaris needs
# path/path_out to differ (different filesystems), so this line is spelled
# out mainly for symmetry with that pattern, not because it does anything
# different here.
path_out=/data3/cekmekci/AtomiumS2_coded/nfp
code_out=code.npy     # the aperture;  config_steps15.conf's stage 3 and step6 read this
prb_out=prb.npy       # the probe;     config_steps15.conf's stage 3 reads this

n=2048                # detector size (pixels), unbinned
npsi=8192             # aperture plane; must clear n + 2*max|shift| + margin
fov_margin=16         # slack held back from the plane edge when filtering
                      # positions -- a patch reaching past it would only
                      # contribute wrap-around
nchunk=2              # positions per GPU pass

# step0.py uses RecNFPCoded, not plain RecNFP: each position reads a window
# of the aperture plane out of the global npsi^2 one instead of transforming
# the whole plane, same idea as the coded engine's code_pad_frac. Window size
# is n + 2*pad per side, pad = pos_pad_frac*n rounded to a cuFFT-friendly
# size. 0 falls back to RecNFP's own whole-plane behavior (the ~40 GB / 4 GPU
# cost that made this knob necessary at npsi=8192).
pos_pad_frac=0.125

niter=257             # last iteration executed is 256
start_iter=0
checkpoint_step=32    # -1 = disabled; the result is saved as .npy at the end
error_step=32         # print error every N iters

rho=1,2,0.1           # gradient step scales: aperture, probe, positions
estimate_rho=False    # True runs RecNFP's coordinate search over rho
rho_estimate_niter=16

paganin=24.05         # delta/beta for the per-position Paganin seed

# --- misfit ---
model=amplitude       # Poisson-weighted; 'intensity' if read noise dominates
psf_sigma=0.0         # Gaussian sigma in detector px; 0 skips the blur

# --- shift interpolation ---
# 'fft' here as in the multi-distance step 0: the scan is single-distance so
# the magnification is 1, a plain phase ramp, and the B-spline stencil error
# would bias the position gradient.
shift_type=fft
log_level=INFO


