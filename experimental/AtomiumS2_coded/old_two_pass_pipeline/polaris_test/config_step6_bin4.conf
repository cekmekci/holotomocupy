# AtomiumS2, coded aperture -- single-distance HT through a gold mask,
# ESRF ID16A, 33.35 keV.  BH reconstruction (step 6), hierarchical level
# bin=4 (16x16 binning).
#
# *** POLARIS SANITY-CHECK LADDER, NOT PART OF THE REAL RECONSTRUCTION. ***
# PASS 2, REFINED.  See config_step6_bin4_pass1.conf for the rationale, and
# config_step6_bin2.conf for what pass 2 means. `step7.py`'s output filename
# (EXTRA_NAME) is a fixed constant, correct_correct3D_extra.txt -- only its
# DIRECTORY changes, via step7.py's --out. Run it with
# `--out rec/test_pass1` so it lands there, a SEPARATE file from the real
# ladder's correct_correct3D_extra.txt (which sits next to the configs with
# no directory prefix); the two ladders can then never collide.

# tomo5 (local sanity check) -- uncomment these 3 and comment out the eagle
# ones below to switch this exact config back to ../tomo5_test's targets
# (also flip correct3d_extra_file below to match):
# path=/data3/cekmekci/AtomiumS2_coded/ht
# code_file=/data3/cekmekci/AtomiumS2_coded/nfp/code.npy
# path_out=/data3/cekmekci/AtomiumS2_coded/rec/test_refined
path=/eagle/APS_IRI/cekmekci/AtomiumS2_coded/ht
in_file=codedHT.h5
code_file=/eagle/APS_IRI/cekmekci/AtomiumS2_coded/nfp/code.npy
obj_init_file=obj_init.npy
path_out=/eagle/APS_IRI/cekmekci/AtomiumS2_coded/rec/test_refined   # SANITY LADDER ONLY

bin=4
nchunk=64
ntheta=400
start_theta=0
stride=18

niter=32
start_iter=0
checkpoint_step=16
error_step=8
debug_step=-1

nz=128
n=128
nzobj=160
nobj=160
ncode=512
mask=1.1

z1_code=-17.75e-3
code_pad_frac=0.125

# Rotation-axis offset, (row, col) UNBINNED px, added to shifts_cor by
# CodedReader.read_pos.  MUST MATCH config_steps15.conf's rot_axis_offset:
# stage 5 folds the same value into the Paganin seed, and step 6 applies it
# again here independently (same as the multi-distance pipeline's
# center_src=config mode).  Not double counting -- step 3 writes shifts_cor
# without it.  Disagree with stage 5 and the seed and the forward model use
# different rotation axes, which shows up as two offset copies of the object.
rot_axis_offset=0.0,-24.0

mask_oob=1
mask_oob_margin=2

model=amplitude
psf_sigma=0.0

lam_laplacian=0
rho=1,0.03,0.01,0.03,0.01   # gradient step scales: obj, prb, pos, code, pos_code
estimate_rho=False
rho_estimate_niter=16

freeze_code=False
freeze_pos_code=False

# Pass 2 only -- absolute path into rec/test_pass1/, where step7.py --out
# puts it for this ladder (see the header comment).
# tomo5 (local sanity check):
# correct3d_extra_file=/data3/cekmekci/AtomiumS2_coded/rec/test_pass1/correct_correct3D_extra.txt
correct3d_extra_file=/eagle/APS_IRI/cekmekci/AtomiumS2_coded/rec/test_pass1/correct_correct3D_extra.txt

fused_hessian=True
check_fused_hessian=False

shift_type=fft
log_level=INFO
