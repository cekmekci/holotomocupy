# AtomiumS2, coded aperture -- single-distance HT through a gold mask,
# ESRF ID16A, 33.35 keV.  BH reconstruction (step 6), hierarchical level
# bin=4 (16x16 binning).
#
# *** POLARIS SANITY-CHECK LADDER, NOT PART OF THE REAL RECONSTRUCTION. ***
# Same toy ladder as ../tomo5_test/config_step6_bin4_pass1.conf, pointed at
# eagle instead of tomo5's /data3 -- exercises the Polaris mechanics (PBS,
# mpiexec, set_affinity_gpu_polaris.sh, the healthcheck) on the SAME cheap
# toy data (400 of 7200 angles, 16x16/8x8 binning) before committing a
# multi-day allocation to the real bin2/bin1/bin0 ladder. Output goes to
# rec/test_pass1 (separate from the real ladder's rec/pass1) so it can never collide with or be
# mistaken for the real ladder's checkpoints.
#
# PASS 1 of 2 -- EVERYTHING REFINES, INCLUDING POSITIONS.  See the real config_step6_bin2_pass1.conf
# for the two-pass rationale; identical here, just at toy scale.
#
# Requires codedHT.h5, code.npy, obj_init.npy already transferred to the
# eagle tree below (see ../polaris_run.sh's header for the transfer list).
#
# ntheta/stride are DELIBERATELY DIFFERENT from the real ladder's (400 of
# 7200 vs all 7200) -- this ladder never resumes from or hands off to the
# real one, so the "identical on every rung" rule only has to hold within
# this ladder, not across the two.

# tomo5 (local sanity check) -- uncomment these 3 and comment out the eagle
# ones below to switch this exact config back to ../tomo5_test's targets:
# path=/data3/cekmekci/AtomiumS2_coded/ht
# code_file=/data3/cekmekci/AtomiumS2_coded/nfp/code.npy
# path_out=/data3/cekmekci/AtomiumS2_coded/rec/test_pass1
path=/eagle/APS_IRI/cekmekci/AtomiumS2_coded/ht
in_file=codedHT.h5
code_file=/eagle/APS_IRI/cekmekci/AtomiumS2_coded/nfp/code.npy
obj_init_file=obj_init.npy
path_out=/eagle/APS_IRI/cekmekci/AtomiumS2_coded/rec/test_pass1   # SANITY LADDER ONLY

bin=4
nchunk=64
ntheta=400             # 400 of 7200 -- a smoke test, not real statistics
start_theta=0
stride=18              # 400*18 = 7200; local_ntheta=100 on 4 ranks, clear of
                      # nz/ncode at every bin this ladder uses (128/512/256/1024)

niter=32              # last iteration executed is 31
start_iter=0
checkpoint_step=16
error_step=8
debug_step=-1

nz=128
n=128
nzobj=160
nobj=160
ncode=512
mask=1.1

z1_code=-17.75e-3
code_pad_frac=0.125

# Rotation-axis offset, (row, col) UNBINNED px, added to shifts_cor by
# CodedReader.read_pos.  MUST MATCH config_steps15.conf's rot_axis_offset:
# stage 5 folds the same value into the Paganin seed, and step 6 applies it
# again here independently (same as the multi-distance pipeline's
# center_src=config mode).  Not double counting -- step 3 writes shifts_cor
# without it.  Disagree with stage 5 and the seed and the forward model use
# different rotation axes, which shows up as two offset copies of the object.
rot_axis_offset=0.0,-24.0

mask_oob=1
mask_oob_margin=2

model=amplitude
psf_sigma=0.0

lam_laplacian=0
rho=1,0.03,0,0.03,0.01   # positions FROZEN again -- REVERTED 2026-11-10.
                      # Unfreezing them (rho[pos] 0 -> 0.01) did not help: the
                      # resulting pass-1 object looked worse when compared
                      # against this frozen baseline, and a frozen pass 1 is
                      # what step 7's measurement (and the whole two-pass
                      # design) actually assumes. See config_step6_bin2_pass1.conf.
estimate_rho=False
rho_estimate_niter=16

freeze_code=False
freeze_pos_code=False

# PASS 1: no correct3d_extra_file -- see config_step6_bin2_pass1.conf.

fused_hessian=True
check_fused_hessian=False

shift_type=fft
log_level=INFO
