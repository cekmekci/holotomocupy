# AtomiumS2, coded aperture -- ESRF ID16A, 33.35 keV.
#
# *** POLARIS SANITY-CHECK LADDER, NOT PART OF THE REAL RECONSTRUCTION. ***
# Toy-ladder twin of ../config_steps15_corrected.conf -- same raw scan, same
# full-resolution stage 5 (it has NO angle/resolution subsetting; a "toy"
# rerun costs exactly what the real one does, confirmed from steps15.py's
# own code: stage 5 reads ntheta/nz/n straight off /exchange/pdata's shape,
# ignoring cfg.ntheta/cfg.n entirely). The only thing that makes this a toy
# run is which correct_correct3D_extra.txt it reads -- the TOY pass 1's
# (rec/test_pass1/), not the real one's -- and the separate output filename,
# so the two ladders' seeds can never collide.

# --- raw input, read-only ---
raw_ht=/data3/vnikitin/ca/raw/AtomiumS2_codedht_random_007nm   # step1 (UNUSED at start_step=5)
pfile=AtomiumS2_codedht_random_007nm                           # scan prefix
correction_file=/data3/vnikitin/ca/raw/AtomiumS2_HT_007nm_/correct_correct3D.txt  # step3 (UNUSED at start_step=5)

# tomo5:
# path=/data3/cekmekci/AtomiumS2_coded/ht
# nfp_file=/data3/cekmekci/AtomiumS2_coded/nfp/data_nfp.h5
# code_file=/data3/cekmekci/AtomiumS2_coded/nfp/code.npy
# prb_file=/data3/cekmekci/AtomiumS2_coded/nfp/prb.npy
# Polaris (ACTIVE):
path=/eagle/APS_IRI/cekmekci/AtomiumS2_coded/ht   # processed data for the HT scan,
in_file=codedHT.h5    # written by step1, appended to by step2 and step3

# --- stage 0's products, consumed by stage 5 (stage 3 is skipped here) ---
nfp_file=/eagle/APS_IRI/cekmekci/AtomiumS2_coded/nfp/data_nfp.h5  # stage 5 takes the nominal z1_code from here
code_file=/eagle/APS_IRI/cekmekci/AtomiumS2_coded/nfp/code.npy
prb_file=/eagle/APS_IRI/cekmekci/AtomiumS2_coded/nfp/prb.npy

# --- stage 5's product, consumed by step 6 -- SEPARATE from both obj_init.npy
# and the real ladder's obj_init_corrected.npy, so the two ladders' seeds
# can never collide.
obj_init_file=obj_init_test_corrected.npy

ntheta=7200           # frames in the raw scan -- UNUSED by stage 5 itself (see
                      # header), kept because parse_args_coded_steps15 requires it
n=2048                # detector size (pixels), unbinned -- also unused by stage 5
nobj=2560             # object grid (pixels), unbinned -- the REAL, full-resolution
                      # value (stage 5 has no toy-scale subsetting, see header), NOT
                      # the toy ladder's own small bin4/bin3 nobj (160/320). MUST
                      # match ../config_steps15.conf and ../config_step6_bin0.conf.

start_step=5          # skip stages 1-3: codedHT.h5 already has
                      # shifts_cor/shifts_code/prb from the original run

# Source-to-code distance.  Set explicitly rather than left to the fallback,
# which reads /exchange/z1 out of data_nfp.h5 -- that scalar was wrong until
# 2026-11-14 (step0a subtracted the focus offset sx0 from z1c, but z1c is
# already measured from the focus) and the eagle copy of the file may still
# carry the old -19.036e-3.  -17.75e-3 is the nominal value, and the one all
# nine config_step6_*.conf already use.
z1_code=-17.75e-3

rot_axis_offset=0.0,-24.0   # added to shifts_cor in stage 5, (row, col) px --
                      # MUST match config_steps15.conf's value

# step7.py's per-angle drift correction from the TOY pass 1 -- the whole
# point of this rerun. Written by polaris_test_run.sh's STEP 7 stage into
# rec/test_pass1/, NOT next to these configs (that's the real ladder's file).
correct3d_extra_file=/eagle/APS_IRI/cekmekci/AtomiumS2_coded/rec/test_pass1/correct_correct3D_extra.txt


# Stage 5 processing -- MUST match ../config_steps15.conf (same raw scan,
# same full-resolution stage 5; only the correction file and output differ).
paganin=30.0
paganin_alpha=1e-2
fbp_filter=ramp
mask_r=0.9
smooth_fwhm=17.0            # Gaussian FWHM in UNBINNED px on numerator AND
                      # denominator before the ratio, his :894-895. 0 disables.
edge_crop=36                # unbinned px stripped off every side of the division
                      # before padding (modelled flat field unreliable there)
bg_box=0.05,0.15,0.05,0.15  # row0,row1,col0,col1 as fractions of the DETECTOR; its
                      # mean on angle 0 is the level the pad ramps to
paganin_bg_box=0.15,0.25,0.15,0.25   # same, fractions of the PADDED frame; its mean on
                      # angle 0's Paganin phase is subtracted from every angle

log_level=INFO
