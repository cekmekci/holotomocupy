# AtomiumS2, coded aperture -- single-distance HT through a gold mask,
# ESRF ID16A, 33.35 keV.  BH reconstruction (step 6), hierarchical level
# bin=2 (4x4 binning).
#
# The three levels SHARE path_out and hand off through start_iter: bin 2
# starts fresh, bin 1 and bin 0 resume from the checkpoint the level above
# wrote and CodedReader upsamples it (x2 per level).  Comment out the rungs
# you do not want in polaris_run.sh rather than editing this.

# ---------------------------------------------------------------------------
# WHERE THIS RUNS.  Pre-processing (step0 + the notebooks) happens on tomo5;
# step 6 (and step 7, in between the two passes) is what goes to Polaris.  Uncomment the trio for the machine
# you are on -- nothing auto-detects it. (path, code_file and path_out all
# three move together -- code.npy is transferred alongside codedHT.h5, it
# does not stay on tomo5.)
#
#   tomo5    path=/data3/cekmekci/AtomiumS2_coded/ht
#            code_file=/data3/cekmekci/AtomiumS2_coded/nfp/code.npy
#            path_out=/data3/cekmekci/AtomiumS2_coded/rec/refined
#   Polaris  path=/eagle/APS_IRI/cekmekci/AtomiumS2_coded/ht
#            code_file=/eagle/APS_IRI/cekmekci/AtomiumS2_coded/nfp/code.npy
#            path_out=/eagle/APS_IRI/cekmekci/AtomiumS2_coded/rec/refined
#
# Transfer before the first Polaris run (Globus): codedHT.h5 (170 GB),
# code.npy (513 MB), obj_init.npy (134 GB at nobj=2560).  data_nfp.h5 and prb.npy stay on
# tomo5 -- step 6 does not read them.  And stripe path_out BEFORE the first
# run, eagle defaults to one OST:   lfs setstripe -c 8 -S 16M <path_out>
# ---------------------------------------------------------------------------
# tomo5:
# path=/data3/cekmekci/AtomiumS2_coded/ht
# code_file=/data3/cekmekci/AtomiumS2_coded/nfp/code.npy
# path_out=/data3/cekmekci/AtomiumS2_coded/rec/refined
# Polaris (ACTIVE):
# --- RUN IDENTITY ----------------------------------------------------------
# `run` is the ONLY line that changes when this folder is copied to make a new
# run.  Every run-specific path below is derived from it by configparser's
# BasicInterpolation, so no file on disk ever carries the run name:
#
#     cp -r runs/baseline runs/<new>
#     sed -i 's/^run=.*/run=<new>/' runs/<new>/*.conf
#
# Shared, read-only, NEVER run-specific:  ht/codedHT.h5, ht/obj_init.npy,
# nfp/{data_nfp.h5,code.npy,prb.npy}.   Everything this run produces lands in
# rec/<run>/.
run=psf
rec=/eagle/APS_IRI/cekmekci/AtomiumS2_coded/rec
# ---------------------------------------------------------------------------
path=/eagle/APS_IRI/cekmekci/AtomiumS2_coded/ht
in_file=codedHT.h5    # /exchange/{pdata,prb,theta,shifts_cor,shifts_code,...}
code_file=/eagle/APS_IRI/cekmekci/AtomiumS2_coded/nfp/code.npy  # the aperture, from step0 (nfp/ folder, not this config's path)
obj_init_file=%(rec)s/%(run)s/obj_init_corrected.npy  # Paganin+FBP seed, REBUILT with step 7's
                      # correction already in pos_obj (config_steps15_corrected.conf,
                      # 2026-11-10) -- geometrically consistent with pos below from
                      # iteration 0, unlike the original obj_init.npy. Also saved
                      # directly at this nobj size now (2026-11-11), padded/tapered
                      # to the background before FBP rather than zero-padded by
                      # CodedReader.read_obj after the fact. Read at bin 2
                      # only: the finer rungs inherit the object through the checkpoint
path_out=%(rec)s/%(run)s/refined   # SHARED by all three rungs

bin=2                 # binning level; every pixel count below is already divided by 2**bin
nchunk=16
ntheta=7200           # ALL acquired angles
start_theta=0
stride=1              # IDENTICAL on every rung: pos/pos_code are
                      # per-angle and ride through the checkpoint
                      # handoff, so the counts must match.

niter=256            # last iteration executed is 255
start_iter=0                 # 0 = start fresh from the step-5 Paganin+FBP volume
checkpoint_step=32    # save checkpoint every N iters (-1 = disabled)
error_step=32         # print error every N iters
debug_step=-1

nz=512
n=512
nzobj=640
nobj=640              # object padded by n/4 so the sample's travel stays inside it
ncode=2048            # aperture plane, 8192 >> bin
mask=1.1              # circular mask radius as fraction of n (-1 = no mask)

# Source-to-code distance.  NEGATIVE: the aperture sits upstream of the focal
# spot, so the code -> sample Fresnel distance is negative too.  NOT the
# nominal value in data_nfp.h5 -- this is the distance that puts the mask in
# focus and is tuned by hand.
z1_code=-17.75e-3
code_pad_frac=0.125   # each projection transforms an [nz+2P, n+2P] window of the
                      # ncode^2 plane instead of the whole thing; accuracy ~1/sqrt(P)

# --- out-of-grid detector pixels ---
# Rotation-axis offset, (row, col) UNBINNED px, added to shifts_cor by
# CodedReader.read_pos.  MUST MATCH config_steps15.conf's rot_axis_offset:
# stage 5 folds the same value into the Paganin seed, and step 6 applies it
# again here independently (same as the multi-distance pipeline's
# center_src=config mode).  Not double counting -- step 3 writes shifts_cor
# without it.  Disagree with stage 5 and the seed and the forward model use
# different rotation axes, which shows up as two offset copies of the object.
rot_axis_offset=0.0,-24.0

mask_oob=1            # drop detector pixels whose footprint leaves the object grid
mask_oob_margin=2     # slack in detector px, covering pos drift during refinement

# --- misfit ---
model=intensity       # switched from amplitude 2026-11-10 -- holotomo-coded-atomiums2
                      # found amplitude let pos jump to wrong positions at this bin
psf_sigma=0.3         # 1.2 raw detector px / 2**2 (sigma is in BINNED px)

lam_laplacian=8e-5    # from holotomo-coded-atomiums2's bin2 value, 2026-11-10.
                      # rho[obj]=1 below satisfies RecCoded's constraint.
rho=1,0.03,0.01,0.03,0.01   # gradient step scales: obj, prb, pos, code, pos_code
estimate_rho=False    # switched back to False 2026-11-11, user request
                      # on this data instead of hardcoding another dataset's values
rho_estimate_niter=16

freeze_code=False     # True holds the aperture fixed (step0 already measured it)
freeze_pos_code=False

# Step 7's per-angle drift refinement, pass 2 only.  Absent (as in the
# _pass1 configs) means no correction applied, which is pass 1's baseline.
correct3d_extra_file=correct_correct3D_extra.txt

fused_hessian=True    # beta and alpha from one Hessian sweep instead of three
check_fused_hessian=False

shift_type=fft        # object-plane shift; one distance means m=1 so fft is exact
log_level=INFO
