# BoneNano, DanMAX -- coded-aperture HOLOTOMOGRAPHY on scan 86.
#
# Stage 6 of the DanMAX coded pipeline. Jointly refines the 3-D object, the
# probe, CA2 and both position sets with the Bilinear-Hessian solver.
#
# WARM START FROM BoneNano_nfp. `code_file` and the probe in the input HDF5
# are the `code.npy` / `prb.npy` that `BoneNano_nfp/step0.py` produced from
# scan 80. The mask is MEASURED here, not solved for cold -- that is the whole
# point of running stage 0 first. See that folder's README for the two-aperture
# mapping (CA1 -> probe, CA2 -> code), which this stage inherits unchanged.
#
# --- the scans ---
# scan-0067  dark                                    (step1)
# scan-0068  flat, no CA1 and no CA2                 (step1)
# scan-0086  CA1 + CA2 + ROTATING SAMPLE, 4001 frames (step2)  <- 95 GB
# rotation angle lives in the companion scan-0086.h5 at
#   /entry/instrument/tom_ry/value   [deg], 0 .. 360

# --- raw DanMAX scans, read-only. Input to step1/step2 only. ---
raw_dir=/data3/cekmekci/bone_nano_holotomo

# --- step1/2/3 write here, step6.py reads it back.  <root>/ht, with
# --- stage 0 in <root>/nfp next to it, as in AtomiumS2_coded.
path=/data3/cekmekci/BoneNano_coded_holotomo/ht
in_file=codedHT.h5

path_out=/data3/cekmekci/BoneNano_coded_holotomo/ht

# --- the warm start, from this folder's own stage 0 in <root>/nfp ---
code_file=/data3/cekmekci/BoneNano_coded_holotomo/nfp/code.npy
# obj_init_file is OPTIONAL. Absent = cold start, which CodedReader allows.
# step3 can write a Paganin+FBP seed; see the README.
# obj_init_file=obj_init.npy        # resolved against `path`

# --- angles ---
# step1/2/3 ALWAYS convert the FULL 4001-frame scan -- they never subsample
# (see the README). These three keys are the ONLY angle subsampling in the
# whole pipeline: CodedReader applies them directly to the fully-stored
# array at solve time (same one-subsampling-point design as AtomiumS2_coded).
# Start with a subset: stride 8 gives 500 angles, which is what the phascade
# notebook used for its first pass.
ntheta=500
start_theta=0
stride=8

# --- grids ---
# TWO DIFFERENT GRIDS -- do not conflate them (see the README's "steps 1-5
# never bin" section):
#
# crop_nz/crop_n: the NATIVE (unbinned) crop steps 1-3 convert and register
# at, centred 2048 x 2048 out of 2592 x 4608. Steps 1-5 never bin anything --
# that is step 6/CodedReader's job alone, same as AtomiumS2_coded (which
# stores and registers at the one native resolution it uses throughout, and
# only ever bins at step 6).
crop_nz=2048
crop_n=2048
#
# nz/n: the BINNED solve-time grid CodedReader produces by binning the native
# pdata/prb/code down by 2**bin at READ time (bin=3 here, so 2048 >> 3 = 256).
# This pair is step 6's own, never used by steps 1-5.
#
# Square is a deliberate simplification, not a limitation -- RecCoded handles
# a rectangular detector (nzobj tracks rows, nobj tracks columns, independent;
# only the object SLICE nobj x nobj and the CODE plane must be square). To go
# rectangular later, widen crop_n/n here and in config_step0.conf together,
# keep npsiz == npsi, and re-check ncode.
nz=256                # detector ROWS    = crop_nz >> bin
n=256                 # detector COLUMNS = crop_n >> bin
nzobj=320             # >= nz + 2*max|pos_obj_binned| + 2*EX + 32, rounded to 32
nobj=320              # >= n  + 2*max|pos_obj_binned| + 2*EX + 32, rounded to 32
# ncode is NOT free. CodedReader bins code.npy by 2**bin and asserts the
# result is exactly (ncode, ncode), so
#
#     ncode == <stage-0 npsi> >> bin  ==  4096 >> 3  ==  512
#
# If the measured code walk needs more than this, raise npsi in
# config_step0.conf and re-run stage 0. step3 checks both and says which.
ncode=512
bin=3
tomo_upsample=1
mask=0.9              # circular object support, as a fraction of nobj

nchunk=8              # angles per GPU pass

# Each projection shifts a WINDOW of the code plane, not the whole of it.
code_pad_frac=0.125

# --- geometry, DanMAX 2026-10 bone_nano scan 86 ---
# TODO CONFIRM against the DanMAX logbook before the beamtime.
# Note z1 (sample) > z1_code (CA2): the aperture is BEFORE the sample, which
# is the geometry RecCoded implements.
energy=19.90                      # keV
z1=0.14925                        # focus -> SAMPLE [m]   (= 2 * 0.074625)
z1_code=0.14125                   # focus -> CA2 [m]      (same plane as stage 0)
focusdetectordistance=0.74625     # focus -> DETECTOR [m]. step1 is what WRITES
                                  # this into the HDF5, so (like z1 and
                                  # detector_pixelsize) it has to live here,
                                  # not be read back from a file step1 hasn't
                                  # written yet.
detector_pixelsize=230e-9         # UNBINNED, magnification-corrected [m]

rot_axis_offset=0.0,0.0           # (row, col) UNBINNED px; untuned

# --- variable step scales: [obj, prb, pos, code, pos_code] ---
# Converted from the phascade notebook's RHO = (prb, code, pos_code, obj,
# pos_obj) = (0.03, 0.03, 0.01, 1.0, 0.01). The orders differ -- do not copy
# the tuple across without reordering it.
rho=1.0,0.03,0.01,0.03,0.01
estimate_rho=True
rho_estimate_niter=16

# Hold the aperture and/or its positions fixed. The mask is already measured
# by stage 0, so freezing it is a legitimate first pass.
freeze_code=False
freeze_pos_code=False

mask_oob=True
mask_oob_margin=2.0

niter=256
start_iter=0
checkpoint_step=32
error_step=8
debug_step=-1

# --- misfit ---
model=amplitude       # Poisson-weighted
psf_sigma=0.0

lam_laplacian=0.0     # rho[obj] must be 1 if this is turned on

shift_type=fft
log_level=INFO
