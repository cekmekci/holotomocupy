# BoneNano, DanMAX -- scan 86.  Config for parse_args_coded_steps15, used
# ONLY by step5_rec_paganin.ipynb here -- stages 1/2/3 are notebooks that read
# config_step6.conf directly (DanMAX's raw data is already HDF5, so there is
# no raw_ht/pfile/correction_file EDF-conversion step for this function to
# drive; those three keys are left unset and parse_args_coded_steps15 allows
# that, cfg.opt_str). If a batch steps15.py is written later for stages 1-3
# as well, point it at config_step6.conf for those, same as the notebooks.

# --- same ht/ directory and file as config_step6.conf ---
path=/data3/cekmekci/BoneNano_coded_holotomo/ht
in_file=codedHT.h5

# --- stage 0's products, in <root>/nfp next to ht/, same as config_step6.conf ---
nfp_file=/data3/cekmekci/BoneNano_coded_holotomo/nfp/data_nfp.h5
code_file=/data3/cekmekci/BoneNano_coded_holotomo/nfp/code.npy
prb_file=/data3/cekmekci/BoneNano_coded_holotomo/nfp/prb.npy

# --- stage 5's product, consumed by step 6 ---
obj_init_file=obj_init.npy

# --- angles, UNBINNED grid ---
# CodedReader.read_obj always treats obj_init.npy as UNBINNED and bins it down
# itself (same rule as pdata/prb/code/detector_pixelsize) -- so step 5 runs at
# bin 0 regardless of what config_step6.conf's own `bin` is set to right now.
#
# step1/2/3 NEVER subsample the angles (see the README) -- they always write
# the FULL scan, and step5_rec_paganin.ipynb reads ALL of it (ntheta, nz, n =
# pdata.shape), not a slice by this value. ntheta below is the true full
# count (4001), used only as a sanity assertion against what's actually
# stored, NOT for selecting a subset -- config_steps15.conf has no
# start_theta/stride to replicate config_step6.conf's own (and only)
# subsampling, so slicing by a number here would silently take the WRONG
# frames the instant that subsampling stops being 1-of-1.
ntheta=4001
n=2048                # detector size (pixels), UNBINNED -- same crop as config_step0/step6
nobj=2560             # object grid (pixels), UNBINNED = 320 (config_step6's nobj at bin 3) << 3.
                      # Provisional until a config_step6_bin0.conf exists to match against.

# Source-to-code distance, same tuned value as config_step6.conf -- the two
# stages must model the same geometry.
z1_code=0.14125

# Positions here are measured DIRECTLY against stage 0's own reference (see
# step3_find_shifts.ipynb and the README's "Conventions that differ from
# stage 0" section) -- step 3 already bakes rot_axis_offset into shifts_cor
# before writing it, unlike AtomiumS2 where it is added independently at each
# stage. So rot_axis_offset here is 0: adding it again would double-count it.
rot_axis_offset=0.0,0.0

# --- Paganin, ported FAITHFULLY from phascade's own bone_nano notebook
# (experiments/bone_nano_holotomo/step2_scan-0086_catomo/1_catomo_recon.ipynb,
# cell 30), not from AtomiumS2's ablated settings. Different sample, different
# settled values -- do not copy AtomiumS2's paganin/paganin_alpha across. ---
paganin=100.0               # delta/beta (his DELTA_BETA)
paganin_alpha=1e-5          # his ALPHA_PAG
fbp_filter=shepp             # his notebook used iterative CG, not FBP, so there
                      # is no filter to match -- 'shepp' is the engine's own
                      # faster/no-worse default (AtomiumS2's step5_rec_paganin.ipynb)
mask_r=0.9                  # same circular FBP mask as his Tomo(..., mask_r=0.9)

# Not used by this folder's step 5 (phascade's bone_nano notebook used none of
# these: a global corner-mean background and a hard zero pad, not a
# bg_box/edge_crop/taper). Left at their parser defaults, unreferenced.
# smooth_fwhm, bg_box, paganin_bg_box, edge_crop -- AtomiumS2-specific knobs.

log_level=INFO
