# BoneNano, DanMAX -- near-field ptychography on the CODED APERTURE alone.
#
# Stage 0 of the DanMAX coded pipeline. It measures CA2 (the moving mask) and
# the probe, which BoneNano_coded_holotomo and BoneNano_coded_holo then take
# as a known starting point instead of solving for the mask cold.
#
# THERE ARE TWO APERTURES IN THIS BEAMLINE AND THE ENGINE TAKES ONE.
# CA1 is static and sits upstream; CA2 is the one that moves per frame. The
# mapping used throughout these folders is
#
#     CA1  -> folded into the PROBE      (prb, recovered here)
#     CA2  -> the coded aperture         (code, recovered here)
#
# so `prb` out of this stage is the probe AT THE CA2 PLANE with CA1 already
# imprinted on it. That is forced by RecNFPCoded/RecCoded having a single
# `code` variable, and it is what the phascade bone_nano notebooks did.
#
# --- the scans, read by step0a_convert.ipynb only ---
# scan-0067  dark
# scan-0068  flat, no CA1 and no CA2
# scan-0069  CA1 alone          (not used by step 0; kept for the CA1 check)
# scan-0080  CA1 + CA2, no sample  <- the near-field ptychography scan

# --- raw DanMAX scans, read-only. Input to step0a only. ---
raw_nfp=/data3/cekmekci/bone_nano_holotomo

# --- step0a writes here, step0.py reads it back ---
path=/data3/cekmekci/BoneNano_nfp
in_file=data_nfp.h5   # /exchange/{pdata,pref,shifts,energy,z1,...}

# --- step0.py's OUTPUT. The holotomo/holo stages read these two. ---
path_out=/data3/cekmekci/BoneNano_nfp
code_out=code.npy     # CA2, the aperture
prb_out=prb.npy       # the probe at the CA2 plane, CA1 included

# --- grids ---
# The DanMAX orca is 2592 x 4608, so everything here is RECTANGULAR.
# CROP ONLY, NO BINNING: a centred 2048 x 4096 out of 2592 x 4608, and nz/n
# are that crop itself.
nz=2048               # detector ROWS
n=4096                # detector COLUMNS
# The aperture plane must clear nz/n + 2*max|shift| + 2*fov_margin, or
# step0.py's FOV filter silently drops positions.
#
# PROVISIONAL. At bin 3 the measured shifts spanned +-62 px, so unbinned that
# is ~+-496 and the minimum is 3072 x 5120 -- exactly the values below with no
# headroom at all, which would put the outermost positions right on the limit.
# Rounded up instead. step0b_shifts.ipynb re-measures at this bin and PRINTS
# the true minimum; put its answer here before the production run.
npsiz=4096            # aperture plane rows
npsi=8192             # aperture plane columns
fov_margin=16         # slack held back from the plane edge when filtering
                      # positions -- a patch reaching past it would only
                      # contribute wrap-around
nchunk=2              # positions per GPU pass (unbinned frames are 64x bigger)

# Each position reads a WINDOW of the aperture plane rather than transforming
# the whole npsi plane. Window is n + 2*pad per side, pad = pos_pad_frac*n.
# 0 falls back to RecNFP's whole-plane behaviour, which at this npsi is the
# ~40 GB / 4 GPU cost the windowing exists to avoid.
pos_pad_frac=0.125

# --- geometry, DanMAX 2026-10 bone_nano ---
# TODO CONFIRM against the DanMAX logbook before the beamtime: these are the
# scan-0080 values from phascade/experiments/bone_nano_holotomo.
#
# step0.py does NOT read these -- it takes them back out of data_nfp.h5. They
# are here because step0a_convert.ipynb is what WRITES them into that file,
# and one copy in one place is the whole point. Edit here, nowhere else.
energy=19.90                       # keV
z1=0.14125                         # focus -> CA2 [m]  (the NFP "sample" plane)
focusdetectordistance=0.74625      # focus -> detector [m]   (note: no "to")
detector_pixelsize=230e-9          # UNBINNED, magnification-corrected [m]
bin=0                              # NO BINNING; centred crop is (nz, n)
dezinger_radius=3                  # 0 disables
dezinger_threshold=0.8

niter=512
start_iter=0
checkpoint_step=64    # -1 = disabled; the result is saved as .npy at the end
error_step=32

rho=1.0,2.0,2.0       # gradient step scales: aperture, probe, positions
estimate_rho=False    # True runs the coordinate search over rho
rho_estimate_niter=16

# No `paganin` key: step0.py starts psi = 1 and seeds the probe by
# back-propagating the mean frame, matching the bone_nano notebook.

# --- misfit ---
model=amplitude       # Poisson-weighted; 'intensity' if read noise dominates
psf_sigma=0.0         # Gaussian sigma in detector px; 0 skips the blur

# --- shift interpolation ---
# 'fft': one distance means magnification 1, a plain phase ramp, and the
# B-spline stencil error would bias the position gradient.
shift_type=fft
log_level=INFO
