# MicroCT_coded_holo, DanMAX -- stage 0, the NFP.
# Recovers the strong CA (code.npy) and the probe (prb.npy = beam x weak CA)
# from scan 93: weak CA (stays in from scan 92 on) + strong CA (moving, 121
# positions), no sample.
#
# Geometry is the SAME OPTICAL CONFIGURATION as BoneNano_coded_holotomo,
# verified by direct motor comparison (scan-0093.h5 vs bone_nano's
# scan-0086.h5 agree to 5 decimals on nf_z, lg_z, sg_z, energy). See
# MICROCT_CODED_HOLO_PLAN.md section 2.
#
# For the NFP, the reconstructed plane IS the CA2 (strong CA) plane, so z1
# here means focus -> CA2, same convention as BoneNano_nfp/config_step0.conf.

raw_nfp=/data3/cekmekci/microCT_nano_holo
path=/data3/cekmekci/MicroCT_coded_holo/nfp
in_file=data_nfp.h5   # /exchange/{pdata,pref,shifts,energy,z1,...}
path_out=/data3/cekmekci/MicroCT_coded_holo/nfp
code_out=code.npy     # the strong CA
prb_out=prb.npy       # beam x weak CA (weak CA included, same as CA1 in BoneNano)

nz=2048               # detector ROWS, bin=0 so this IS the native crop
n=2048                # detector COLUMNS -- SQUARE (unlike BoneNano_nfp's
                      # rectangular 2048x4096; this orca crop is centred square)
npsiz=4096            # aperture plane rows -- MUST equal npsi (code plane is square)
npsi=4096             # PROVISIONAL. step0b_shifts.ipynb prints the true minimum
                      # from the measured walk; raise this BEFORE running step0.py
                      # if the walk does not fit (its FOV filter silently drops
                      # positions that don't fit otherwise).
fov_margin=16
nchunk=2
pos_pad_frac=0.125

energy=19.90                       # keV
z1=0.14125                         # focus -> CA2 (the NFP "sample" plane)
focusdetectordistance=0.74625      # focus -> detector [m]  (note: no "to")
detector_pixelsize=230e-9          # UNBINNED, magnification-corrected [m]
bin=0                              # NO BINNING; centred crop is (nz, n)
dezinger_radius=3                  # 0 disables
dezinger_threshold=0.8

niter=512
start_iter=0
checkpoint_step=64    # -1 = disabled; the result is saved as .npy at the end
error_step=32
rho=1.0,2.0,2.0       # gradient step scales: aperture, probe, positions
estimate_rho=False    # True runs the coordinate search over rho
rho_estimate_niter=16
model=amplitude       # Poisson-weighted
psf_sigma=0.0         # Gaussian sigma in detector px; 0 skips the blur
shift_type=fft
log_level=INFO
