# MicroCT_coded_holo, DanMAX -- the sample scan (scan 94) and the solve.
#
# 2-D coded-aperture HOLOGRAPHY, not holotomography: no rotation, no theta.
# The scan axis is FRAMES (121 of them), each with its own code position; the
# object is one shared 2-D plane. Engine is RecHoloCoded / HoloCodedReader.
#
# step1a_convert / step1b_preprocess / step1c_find_shifts ALL read this file.
# step6.py reads it too. See MICROCT_CODED_HOLO_PLAN.md for the full design.

# --- raw DanMAX scans, read-only. Input to step1a/step1b only. ---
raw_dir=/data3/cekmekci/microCT_nano_holo
# scan-0090  dark                                    (step1a)
# scan-0091  flat, NO CA at all                       (step1a)
# scan-0094  weak CA + strong CA + SAMPLE (fixed), strong CA moves, 121 frames  (step1b)

# --- step1a/b/c write here, step6.py reads it back ---
path=/data3/cekmekci/MicroCT_coded_holo/holo
in_file=codedHolo.h5

path_out=/data3/cekmekci/MicroCT_coded_holo/holo

# --- the warm start, from this experiment's own stage 0 in <root>/nfp ---
code_file=/data3/cekmekci/MicroCT_coded_holo/nfp/code.npy
# obj_init_file is OPTIONAL. Absent = cold start, which HoloCodedReader
# allows, and which is fine here: 121 coded frames of ONE plane is a much
# better-conditioned problem than the holotomo case, so no Paganin+FBP seed
# is needed.
# obj_init_file=obj_init.npy       # resolved against `path`

# --- frames ---
# ALL 121 frames of scan 94. No subsampling anywhere in steps 1a-1c -- the
# whole scan is small (121 frames), so there is no "first pass, fewer frames"
# shortcut the way the holotomo folder has for its 4001-angle scan.
nframes=121

# --- grids ---
# TWO DIFFERENT GRIDS -- do not conflate them (same split as
# BoneNano_coded_holotomo/config_step6.conf, see its README for the full
# reasoning):
#
# crop_nz/crop_n: the NATIVE (unbinned) crop steps 1a-1c convert and register
# at, centred 2048 x 2048 out of 2592 x 4608. Steps 1a-1c never bin anything
# -- that is HoloCodedReader's job alone, at solve time.
crop_nz=2048
crop_n=2048
#
# nz/n: the BINNED solve-time grid HoloCodedReader produces by binning the
# native pdata/prb/code down by 2**bin at READ time.
nz=2048 # 512                # = crop_nz >> bin
n=2048 # 512                 # = crop_n  >> bin
nzobj=2560 # 640             # >= nz + 2*max|pos_obj| + 2*EX + 32, rounded to 32;
                      # step1c_find_shifts.ipynb checks this against the
                      # measured walk and says which to raise
nobj=2560 # 640              # same check, >= n + 2*max|pos_obj| + 2*EX + 32
# ncode is NOT free. HoloCodedReader bins code.npy by 2**bin and asserts the
# result is exactly (ncode, ncode), so
#
#     ncode == <stage-0 npsi> >> bin
#
# config_step0.conf was run with npsi=4096 (step0b_shifts.ipynb's measured
# minimum, raised from the plan's provisional 8192), and bin=2 below, so
#
#     ncode = 4096 >> 2 = 1024
#
# If stage 0's npsi changes, this MUST change with it -- step1c checks both
# and says which is wrong.
ncode=4096 # 1024
bin=0 # 2

code_pad_frac=0.125   # each frame shifts a WINDOW of the code plane, not the
                      # whole of it; the pad is code_pad_frac*n per side

# --- geometry, DanMAX 2026 microCT_nano_holo, scan 94 ---
# energy / z1_code / focusdetectordistance / detector_pixelsize are VERIFIED:
# scan-0093.h5's motors (nf_z, lg_z, sg_z, hdcm_energy) agree with
# bone_nano_holotomo's scan-0086.h5 to 5 decimal places -- same optical
# configuration. See MICROCT_CODED_HOLO_PLAN.md section 2.
#
# z1 (focus -> SAMPLE) is NOT verified. This sample does not sit on the
# tomography stage bone_nano's z1=0.14925 was measured for, and no motor in
# these files has been shown to encode focus->sample distance (tom_y is a
# TRANSVERSE stage -- it swings the sample in/out, seen as an exact 20.000 mm
# jump between scan 93 sample-out and scan 94 sample-in, not a propagation-
# axis move). The value below is INHERITED FROM BONENANO, UNCONFIRMED for
# this sample.  TODO CONFIRM against the DanMAX logbook before trusting this.
energy=19.90                      # keV
z1=0.14925                        # focus -> SAMPLE [m]   TODO CONFIRM, see above
z1_code=0.14125                   # focus -> CA2 [m]      VERIFIED (same plane as stage 0)
focusdetectordistance=0.74625     # focus -> detector [m] VERIFIED
detector_pixelsize=230e-9         # UNBINNED, magnification-corrected [m]  VERIFIED

# --- variable step scales: [obj, prb, pos, code, pos_code] ---
# Same values AtomiumS2_coded/BoneNano_coded_holotomo settled on. Note the
# ORDER differs from phascade's own (prb, code, pos_code, obj, pos_obj) tuple
# -- never copy a phascade tuple across without reordering it.
rho=1.0,0.03,0.01,0.03,0.01
estimate_rho=False
rho_estimate_niter=16

freeze_code=False
freeze_pos_code=False

mask_oob=True
mask_oob_margin=2.0

niter=256
nchunk=4             # frames per GPU pass; lower this first on OOM
start_iter=0
checkpoint_step=32
error_step=8
debug_step=-1

# --- misfit ---
model=amplitude       # Poisson-weighted
psf_sigma=0.0

shift_type=fft
log_level=INFO
